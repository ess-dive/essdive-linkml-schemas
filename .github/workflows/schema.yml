name: Test and publish schema

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests -v

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --locked
      - name: Fetch and extract Dataset (LinkML conversion is not implemented)
        run: uv run --locked python -m ess_dive_schemas
      - uses: actions/upload-artifact@v7
        with:
          name: dataset-schema
          path: dist/dataset.schema.json
          if-no-files-found: error
          retention-days: 30
