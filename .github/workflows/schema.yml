name: Test schema script

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ESSDIVE_TOOLSET_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --locked
      - run: uv venv .toolset-venv
      - run: uv pip install --python .toolset-venv/bin/python ./vendor/essdive-toolset
      - run: uv run --locked python -m unittest discover -s tests -v
