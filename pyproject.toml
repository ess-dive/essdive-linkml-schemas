[project]
name = "ess-dive-schemas"
version = "0.1.0"
description = "Extract ESS-DIVE Dataset metadata and convert it to LinkML."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "linkml==1.11.1",
    "linkml-runtime==1.11.1",
    "pyyaml>=6",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "coverage>=7.16.1",
    "jsonschema>=4",
]
