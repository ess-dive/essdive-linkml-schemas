  PropertyValueEssDive:
    description: 'A property-value pair, e.g. representing a feature of a product or place (e.g. DOI).

      DOI is the only propertyID accepted.

      Subset of https://schema.org/PropertyValue'
    slots:
    - '@type'
    - propertyID
    - value
    slot_usage:
      '@type':
        annotations:
          json_schema_default:
            tag: json_schema_default
            value: PropertyValue
        range: string
        pattern: PropertyValue
      propertyID:
        annotations:
          json_schema_default:
            tag: json_schema_default
            value: ess-dive
        pattern: ess-dive
