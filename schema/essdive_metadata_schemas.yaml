    extra_slots:
      allowed: true
  Place:
    description: 'Entities that have a somewhat fixed, physical extension.

      Follows https://schema.org/Place'
    slots:
    - '@type'
    - description
    slot_usage:
      '@type':
        annotations:
          json_schema_default:
            tag: json_schema_default
            value: Place
        range: string
        pattern: Place
      description:
        required: true
    attributes:
      geo:
        description: Accepted names are 'Northwest and Southeast.
        slot_uri: schema:geo
        required: true
        any_of:
        - range: GeoCoordinates
          inlined: true
        - range: GeoCoordinates
          multivalued: true
          inlined: true
          inlined_as_list: true
          minimum_cardinality: 1
          maximum_cardinality: 2
    class_uri: schema:Place
    extra_slots:
      allowed: false
  ProjectOrganizationIdentifier:
    description: Project Organization Identifier
    attributes:
      identifier:
        description: An ESS-DIVE Identifier representing this project.
        slot_uri: schema:identifier
        range: PropertyValueEssDive
        required: true
        inlined: true
    extra_slots:
      allowed: true
  PropertyValueDOI:
