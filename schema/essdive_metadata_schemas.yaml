description: Direct, curated OpenAPI conversion; see comments for policies and limitations.
title: ESS-DIVE Dataset metadata
comments:
- 'Scope: Dataset and transitive metadata dependencies. JSON keys and scalar-or-array alternatives are
  retained. @id is not promoted to an identifier.'
- String lengths are represented by reusable string patterns; source regexes and numeric bounds are preserved.
  Source defaults are metadata, not inserted values.
- ContactPerson and DatasetProvider are curated role profiles; see their comments. Semantic mappings are
  explicit policy, not inferred from every property spelling.
- 'LIMITATIONS: json_schema_uniqueItems and json_schema_format annotations preserve rules without enforcing
  them. LinkML 1.11.1 JSON Schema output also admits some optional nulls and does not honor per-class
  extra_slots. Use gen-json-schema --closed for a closed Dataset root. This is not exact API-validator
  equivalence.'
id: https://w3id.org/ess-dive/dataset/combined
imports:
- linkml:types
prefixes:
  linkml: https://w3id.org/linkml/
  essdive: https://w3id.org/ess-dive/dataset/
  schema: https://schema.org/
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  xsd: http://www.w3.org/2001/XMLSchema#
default_prefix: essdive
types:
