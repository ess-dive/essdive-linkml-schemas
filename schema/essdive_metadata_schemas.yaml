    pattern: ^[\s\S]{1,175}(?![\s\S])
  text_1_255:
    description: String containing 1–255 characters.
    typeof: string
    uri: xsd:string
    pattern: ^[\s\S]{1,255}(?![\s\S])
  text_1_1024:
    description: String containing 1–1024 characters.
