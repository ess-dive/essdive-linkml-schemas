name: MySchema
id: https://example.org/MySchema
imports:
- linkml:types
prefixes:
  MySchema: https://example.org/MySchema
  linkml: https://w3id.org/linkml/
default_prefix: MySchema
slots:
  manage:
    multivalued: true
  edit:
    multivalued: true
  view:
    multivalued: true
  detail:
    required: true
  contentUrl:
    description: Actual bytes of the dataset object, for example the data file or
      an archive file.
    required: true
  contentSize:
    description: File size in kilobytes.
    range: float
    required: true
  encodingFormat:
    description: Format type usually expressed using a MIME format (see http://www.iana.org/assignments/media-types/media-types.xhtml),
      e.g. text/csv for a comma delimited file
    required: true
  identifier:
    description: An ESS-DIVE Identifier representing this project.
    required: true
  name:
    description: A brief but meaningful label for this web page.
    required: true
  '@id': {}
  '@type': {}
  description:
    required: true
  datePublished:
    description: "This is the date range of a the publication of a package. It should\
      \ follow a one of the following formats:\n \n- YYYY  \n - YYYY-MM \n- [YYYY-MM-DD\
      \ TO YYYY-MM-DD] \n- [YYYY TO YYYY-MM-DD] \n- [YYYY-MM-DD TO *] \n\n \nExample\
      \ 1: if you want the packages from Jan-1-2021 to Nov-01-2021 [2021-01-01 TO\
      \ 2021-11-01] \n \nExample 2: if you want the packages from Jan-1-2021 to present\
      \ [2021-01-01 TO *]"
  '@context': {}
  alternateName:
    description: (Alternative Identifiers) DOI and alternate identifiers of the data
      package if it has been previously published elsewhere. Alternate identifers
      provide pertinent information that can identify and locate the data set within
      your site's data management system.
  creator:
    description: The creator/submitter of datasets
  keywords:
    multivalued: true
  variableMeasured:
    description: (Data Variables) Measurement variables present in the data package.
  license:
    description: (Data Usage Rights) Choose how you wish your data to be shared and
      reused. Usage rights for the metadata will always be Creative Commons Public
      Domain.
  spatialCoverage:
    description: (Location) Add one or more places with at least one GeoCoordinate
      and no more than two.
  award:
    description: (DOE Contracts) If applicable, list the numbers of any DOE contract
      under which the data in the package was funded. If the data were a result of
      a joint effort between two or more DOE Site/Facility Management Contractors,
      etc., additional DOE contract numbers may be entered.
  funder:
    description: (Funding Organizations) List of organizations that funded the work.
    required: true
  citation:
    description: The citation created from the data package metadata
    required: true
  editor:
    description: (Contact Person) Person who should be listed as the contact for the
      data package for the purposes of the DOI or for users seeking further information
      for the data. Only one contact is allowed per data package.
    required: true
  provider:
    description: (Project/Publisher) Enter the name of the DOE project to associate
      with this dataset. The project is cited as the publisher of this dataset. If
      multiple projects were involved, this is the project that had the largest contribution
      to this dataset.
    required: true
  contributor:
    description: (Contributor) Additional contributors involved in producing the data.
      These could include people who assisted in creating the data package but wouldn't
      be considered authors for publication.  Enter as many contributors as needed.
  temporalCoverage:
    description: (Start Date/End Date) The date range that the data in this data package
      covers.
  measurementTechnique:
    description: (Methods) Information about the methods employed in collecting or
      generating a data set or other resource. These include descriptions of sampling
      or experimental procedures, data QA/QC, processing and synthesis.  Each method
      section documents the series of procedures followed to produce data. Enter as
      many sections as needed. If you have already published the procedures used,
      properly cite the relevant publications.
  hasPart:
    description: One or more files that are part of this data package reside outside
      of the main archive. This could be a link to an individual file or a directory.
  archivedAt:
    description: This respresents where a copy of this dataset resides.
  sameAs:
    description: DOI URL of a reference Web page that unambiguously indicates the
      item's identity. Must begin with 'https://doi.org/'.
  distribution:
    range: DataDownload
    required: true
    multivalued: true
  doi:
    description: The DOI string that was reserved
    required: true
  dataset:
    range: DatasetPreview
    required: true
  visibility:
    range: VisibilityStatuses
    required: true
  latitude:
    range: float
    required: true
  longitude:
    range: float
    required: true
  id:
    description: ESS-DIVE unique identifier
    required: true
  status:
    range: DOIStatuses
    required: true
  email: {}
  member: {}
  givenName: {}
  familyName:
    required: true
  affiliation: {}
  jobTitle:
    required: true
  viewUrl:
    description: URL to the ESS-DIVE web page for viewing the data package
    required: true
  url:
    description: URL of the web page.
    required: true
  next:
    description: The url that refers to the next version of the dataset
  previous:
    description: The url that refers to the previous version of the dataset
  dateUploaded:
    description: The date that the data package was uploaded to ESS-DIVE
    required: true
  dateModified:
    description: The last modified date of the data package metadata
    required: true
  isPublic:
    description: Is this data package publicly accessible?
    range: boolean
  errors:
    required: true
  warnings:
    description: Warning messages about the submission
    required: true
  total:
    description: The total records returned by the query
    range: integer
    required: true
  pageSize:
    description: The requested result page size
    range: integer
    required: true
  user:
    description: The user that performed the query
    required: true
  nextCursor:
    description: Opaque cursor for the next page of datasets
  previousCursor:
    description: Opaque cursor for the previous page of datasets
  result:
    range: PackagesResultItem
    required: true
    multivalued: true
  providerName:
    description: (Project/Publisher) Text search over the dataset project/provider
      metadata. Supports phrase search with double quotes and single-term wildcards.
      Unquoted or non-exact values may be tokenized and can match multiple providers
      that share one or more terms.
  text:
    description: Searches any metadata field that contains the passed text
  beginDate:
    description: Temporal coverage window start date in YYYY, YYYY-MM, or YYYY-MM-DD.
  endDate:
    description: Last date in data package. Provide in ISO format (YYYY-MM-DD). Leave
      blank if your data set is open-ended.
  bbox:
    description: 'Bounding box in the format min_lat,min_lon,max_lat,max_lon. Example:
      34.0000,-119.0000,35.0000,-117.0000'
  lat:
    description: Latitude for point-based spatial search. Must be used with longitude
      (lon) and radius.
    range: float
  lon:
    description: Longitude for point-based spatial search. Must be used with latitude
      (lat) and radius.
    range: float
  radius:
    description: Point-based search radius in meters. Must be used with latitude (lat)
      and longitude (lon). This is an approximate nearby search using geohash cells
      (optimized for recall, with possible false positives near cell edges).
    range: float
  sort:
    description: 'Comma-separated ordered sort clauses in the format `field:direction`.
      Supported fields: `name`, `dateUploaded`, `authorLastName`. Supported directions:
      `asc`, `desc`.'
  isPublicationRequested:
    description: Datasets that have been requested for publication.
    range: boolean
  rowStart:
    description: Legacy offset paging start row retained for compatibility
    range: integer
    required: true
  query:
    description: The search query made by the user
    required: true
  geo:
    description: Accepted names are 'Northwest and Southeast.
    required: true
  propertyID: {}
  value:
    description: An ESS-DIVE identifier (e.g. a142b35b-f74c-4ea6-8951-8ffa46c301f3)
    required: true
  accessPolicy:
    range: AccessPolicy
    required: true
  startDate:
    description: Earliest date in data package. Provide in ISO format (YYYY-MM-DD)
    required: true
  loc:
    required: true
    multivalued: true
  msg:
    required: true
  type:
    required: true
classes:
  AccessPolicy:
    description: Data package Access Policy
    slots:
    - manage
    - edit
    - view
    slot_usage:
      manage:
        multivalued: true
      edit:
        multivalued: true
      view:
        multivalued: true
  Conflict:
    description: Message for a 408 bad request response
    slots:
    - detail
    slot_usage:
      detail:
        required: true
  DOIStatuses:
    description: An enumeration.
  DataDownload:
    description: All or part of a Dataset in downloadable form.  Subset of https://schema.org/DataDownload
    slots:
    - contentUrl
    - contentSize
    - encodingFormat
    - identifier
    - name
    slot_usage:
      contentUrl:
        description: Actual bytes of the dataset object, for example the data file
          or an archive file.
        required: true
      contentSize:
        description: File size in kilobytes.
        range: float
        required: true
      encodingFormat:
        description: Format type usually expressed using a MIME format (see http://www.iana.org/assignments/media-types/media-types.xhtml),
          e.g. text/csv for a comma delimited file
        required: true
      identifier:
        description: The unique permanent identifier of this data object
        required: true
      name:
        description: The file name (e.g. mydata.csv)
        required: true
  Dataset:
    description: Main JSON-LD data model for an ESS-DIVE Dataset.  Use this dataset
      for creating and updating datasets
    slots:
    - '@id'
    - '@type'
    - name
    - description
    - datePublished
    - '@context'
    - alternateName
    - creator
    - keywords
    - variableMeasured
    - license
    - spatialCoverage
    - award
    - funder
    - citation
    - editor
    - provider
    - contributor
    - temporalCoverage
    - measurementTechnique
    - hasPart
    - archivedAt
    - identifier
    - sameAs
    slot_usage:
      '@id':
        description: The public identifier of this dataset; typically a DOI (Digital
          Object Identifier)
      '@type': {}
      name:
        description: (Title) A brief but meaningful title for this data package.
        required: true
      description:
        description: (Abstract) A concise description of the purpose and content of
          this data package.
        required: true
      datePublished:
        description: '(Publication Date) Specify a custom date or year when this data
          package can be made publicly available. If this is not specified, it will
          default to the current date.

          The value should either by a four digit year (YYYY) or a full date in the
          ISO format (YYYY-MM-DD).'
        required: true
      '@context': {}
      alternateName:
        description: (Alternative Identifiers) DOI and alternate identifiers of the
          data package if it has been previously published elsewhere. Alternate identifers
          provide pertinent information that can identify and locate the data set
          within your site's data management system.
      creator:
        description: (Creator/Author) The main researchers involved in producing the
          data. These include authors, owners, originators and principal investigators
          who should be listed in the citation. One or more creators is required.
          If none are entered, you will be set as the creator of this document. List
          creators in the order they need to appear in the citation. More entries
          will appear as you enter information.
        required: true
      keywords:
        description: Keywords that should be associated with this data package to
          enable thematic searches.
        required: true
      variableMeasured:
        description: (Data Variables) Measurement variables present in the data package.
      license:
        description: (Data Usage Rights) Choose how you wish your data to be shared
          and reused. Usage rights for the metadata will always be Creative Commons
          Public Domain.
      spatialCoverage:
        description: (Location) Add one or more places with at least one GeoCoordinate
          and no more than two.
      award:
        description: (DOE Contracts) If applicable, list the numbers of any DOE contract
          under which the data in the package was funded. If the data were a result
          of a joint effort between two or more DOE Site/Facility Management Contractors,
          etc., additional DOE contract numbers may be entered.
      funder:
        description: (Funding Organizations) List of organizations that funded the
          work.
        required: true
      citation:
        description: (Related References) Associated publications or data packages
          where users can learn more about the dataset, processing method, or how
          the data were used.Enter the DOIs of all related papers or data packages.
          If no DOI is available, enter the current citation information for the reference.
      editor:
        description: (Contact Person) Person who should be listed as the contact for
          the data package for the purposes of the DOI or for users seeking further
          information for the data. Only one contact is allowed per data package.
        required: true
      provider:
        description: (Project/Publisher Identifier) Enter the identifier of the DOE
          project to associate with this dataset. The project is cited as the publisher
          of this dataset. If multiple projects were involved, this is the project
          that had the largest contribution to this dataset.
        required: true
      contributor:
        description: (Contributor) Additional contributors involved in producing the
          data. These could include people who assisted in creating the data package
          but wouldn't be considered authors for publication.  Enter as many contributors
          as needed.
      temporalCoverage:
        description: (Start Date/End Date) The date range that the data in this data
          package covers.
      measurementTechnique:
        description: (Methods) Information about the methods employed in collecting
          or generating a data set or other resource. These include descriptions of
          sampling or experimental procedures, data QA/QC, processing and synthesis.  Each
          method section documents the series of procedures followed to produce data.
          Enter as many sections as needed. If you have already published the procedures
          used, properly cite the relevant publications.
      hasPart:
        description: One or more files that are part of this data package reside outside
          of the main archive. This could be a link to an individual file or a directory.
      archivedAt:
        description: This respresents where a copy of this dataset resides.
      identifier:
        description: A Digital Object Identifier representing this data package.
      sameAs:
        description: DOI URL of a reference Web page that unambiguously indicates
          the item's identity. Must begin with 'https://doi.org/'.
  DatasetDistribution:
    description: Dataset metadata with the list of files for download
    slots:
    - '@id'
    - '@type'
    - name
    - description
    - datePublished
    - '@context'
    - alternateName
    - creator
    - keywords
    - variableMeasured
    - license
    - spatialCoverage
    - award
    - funder
    - citation
    - editor
    - provider
    - contributor
    - temporalCoverage
    - measurementTechnique
    - hasPart
    - archivedAt
    - identifier
    - sameAs
    - distribution
    slot_usage:
      '@id':
        description: The public identifier of this dataset; typically a DOI (Digital
          Object Identifier)
      '@type': {}
      name:
        description: (Title) A brief but meaningful title for this data package.
        required: true
      description:
        description: (Abstract) A concise description of the purpose and content of
          this data package.
        required: true
      datePublished:
        description: '(Publication Date) Specify a custom date or year when this data
          package can be made publicly available. If this is not specified, it will
          default to the current date.

          The value should either by a four digit year (YYYY) or a full date in the
          ISO format (YYYY-MM-DD).'
        required: true
      '@context': {}
      alternateName:
        description: (Alternative Identifiers) DOI and alternate identifiers of the
          data package if it has been previously published elsewhere. Alternate identifers
          provide pertinent information that can identify and locate the data set
          within your site's data management system.
      creator:
        description: (Creator/Author) The main researchers involved in producing the
          data. These include authors, owners, originators and principal investigators
          who should be listed in the citation. One or more creators is required.
          If none are entered, you will be set as the creator of this document. List
          creators in the order they need to appear in the citation. More entries
          will appear as you enter information.
        required: true
      keywords:
        description: Keywords that should be associated with this data package to
          enable thematic searches.
        required: true
      variableMeasured:
        description: (Data Variables) Measurement variables present in the data package.
      license:
        description: (Data Usage Rights) Choose how you wish your data to be shared
          and reused. Usage rights for the metadata will always be Creative Commons
          Public Domain.
      spatialCoverage:
        description: (Location) Add one or more places with at least one GeoCoordinate
          and no more than two.
      award:
        description: (DOE Contracts) If applicable, list the numbers of any DOE contract
          under which the data in the package was funded. If the data were a result
          of a joint effort between two or more DOE Site/Facility Management Contractors,
          etc., additional DOE contract numbers may be entered.
      funder:
        description: (Funding Organizations) List of organizations that funded the
          work.
        required: true
      citation:
        description: (Related References) Associated publications or data packages
          where users can learn more about the dataset, processing method, or how
          the data were used.Enter the DOIs of all related papers or data packages.
          If no DOI is available, enter the current citation information for the reference.
      editor:
        description: (Contact Person) Person who should be listed as the contact for
          the data package for the purposes of the DOI or for users seeking further
          information for the data. Only one contact is allowed per data package.
        required: true
      provider:
        description: (Project/Publisher) Enter the name of the DOE project to associate
          with this dataset. The project is cited as the publisher of this dataset.
          If multiple projects were involved, this is the project that had the largest
          contribution to this dataset.
        required: true
      contributor:
        description: (Contributor) Additional contributors involved in producing the
          data. These could include people who assisted in creating the data package
          but wouldn't be considered authors for publication.  Enter as many contributors
          as needed.
      temporalCoverage:
        description: (Start Date/End Date) The date range that the data in this data
          package covers.
      measurementTechnique:
        description: (Methods) Information about the methods employed in collecting
          or generating a data set or other resource. These include descriptions of
          sampling or experimental procedures, data QA/QC, processing and synthesis.  Each
          method section documents the series of procedures followed to produce data.
          Enter as many sections as needed. If you have already published the procedures
          used, properly cite the relevant publications.
      hasPart:
        description: One or more files that are part of this data package reside outside
          of the main archive. This could be a link to an individual file or a directory.
      archivedAt:
        description: This respresents where a copy of this dataset resides.
      identifier:
        description: A Digital Object Identifier representing this data package.
      sameAs:
        description: DOI URL of a reference Web page that unambiguously indicates
          the item's identity. Must begin with 'https://doi.org/'.
      distribution:
        range: DataDownload
        required: true
        multivalued: true
  DatasetPreview:
    description: Brief preview of a Dataset
    slots:
    - '@id'
    - '@type'
    - name
    - description
    - datePublished
    slot_usage:
      '@id':
        description: The public identifier of this dataset; typically a DOI (Digital
          Object Identifier)
      '@type': {}
      name:
        description: (Title) A brief but meaningful title for this data package.
        required: true
      description:
        description: (Abstract) A concise description of the purpose and content of
          this data package.
        required: true
      datePublished:
        description: '(Publication Date) Specify a custom date or year when this data
          package can be made publicly available. If this is not specified, it will
          default to the current date.

          The value should either by a four digit year (YYYY) or a full date in the
          ISO format (YYYY-MM-DD).'
        required: true
  DatasetStatus:
    description: Dataset status
    slots:
    - doi
    - dataset
    - visibility
    slot_usage:
      doi:
        range: DOIStatuses
        required: true
      dataset:
        range: PublicationStatuses
        required: true
      visibility:
        range: VisibilityStatuses
        required: true
  GeoCoordinates:
    description: 'The geographic coordinates of a place or event.

      A subset of https://schema.org/GeoCoordinates'
    slots:
    - '@type'
    - name
    - latitude
    - longitude
    slot_usage:
      '@type': {}
      name:
        range: GeoCoordinatesName
        required: true
      latitude:
        range: float
        required: true
      longitude:
        range: float
        required: true
  GeoCoordinatesName:
    description: Enum of the allowed GeoCoorinates names
  HTTPValidationError:
    slots:
    - detail
    slot_usage:
      detail:
        range: ValidationError
        multivalued: true
  InternalServerError:
    description: Message fpr a 500 internal server error
    slots:
    - detail
    slot_usage:
      detail:
        required: true
  ManagePublication:
    description: Response for managing a dataset's publication
    slots:
    - detail
    - id
    - status
    slot_usage:
      detail:
        required: true
      id:
        description: ESS-DIVE unique identifier
        required: true
      status:
        range: PublicationStatuses
        required: true
  MessageModel:
    description: Schema for API Messages
    slots:
    - detail
    slot_usage:
      detail:
        required: true
  MethodNotAllowed:
    description: Message for a 405 method not allowed response
    slots:
    - detail
    slot_usage:
      detail:
        required: true
  NotFound:
    description: Message for a 404 method not found response
    slots:
    - detail
    slot_usage:
      detail:
        required: true
  Organization:
    description: ESS-DIVE base model to add some specific handling of openapi schema
    slots:
    - '@type'
    - '@id'
    - name
    - email
    - member
    slot_usage:
      '@type': {}
      '@id': {}
      name:
        required: true
      email: {}
      member: {}
  OrganizationMember:
    description: The principal investigator
    slots:
    - '@type'
    - '@id'
    - email
    - givenName
    - familyName
    - affiliation
    - jobTitle
    slot_usage:
      '@type': {}
      '@id': {}
      email: {}
      givenName: {}
      familyName:
        required: true
      affiliation: {}
      jobTitle:
        required: true
  PackageResult:
    description: The result object for a single data package
    slots:
    - id
    - viewUrl
    - url
    - next
    - previous
    - dateUploaded
    - dateModified
    - isPublic
    - citation
    - dataset
    slot_usage:
      id:
        description: ESS-DIVE unique identifier
        required: true
      viewUrl:
        description: URL to the ESS-DIVE web page for viewing the data package
        required: true
      url:
        description: The url that refers to the current dataset
        required: true
      next:
        description: The url that refers to the next version of the dataset
      previous:
        description: The url that refers to the previous version of the dataset
      dateUploaded:
        description: The date that the data package was uploaded to ESS-DIVE
        required: true
      dateModified:
        description: The last modified date of the data package metadata
        required: true
      isPublic:
        description: Is this data package publicly accessible?
        range: boolean
      citation:
        description: The citation created from the data package metadata
        required: true
      dataset:
        range: DatasetDistribution
        required: true
  PackageSubmission:
    description: Response for an updated or newly submitted data package
    slots:
    - detail
    - errors
    - warnings
    - id
    - viewUrl
    - dataset
    slot_usage:
      detail:
        required: true
      errors:
        required: true
      warnings:
        description: Warning messages about the submission
        required: true
      id:
        description: ESS-DIVE unique identifier
        required: true
      viewUrl:
        description: URL to the ESS-DIVE web page for viewing the data package
        required: true
      dataset:
        range: Dataset
        required: true
  PackageVersionsResult:
    description: Response for list of dataset versions
    slots:
    - total
    - pageSize
    - user
    - nextCursor
    - previousCursor
    - result
    slot_usage:
      total:
        description: The total visible versions returned by the query
        range: integer
        required: true
      pageSize:
        description: The requested result page size
        range: integer
        required: true
      user:
        description: The user that performed the query
        required: true
      nextCursor:
        description: Opaque cursor for the next page of older versions
      previousCursor:
        description: Opaque cursor for the previous page of newer versions
      result:
        range: PackagesResultItem
        required: true
        multivalued: true
  PackagesQueryParams:
    slots:
    - isPublic
    - creator
    - providerName
    - text
    - datePublished
    - beginDate
    - endDate
    - keywords
    - bbox
    - lat
    - lon
    - radius
    - sort
    - isPublicationRequested
    slot_usage:
      isPublic:
        description: If set with true, would only return public packages.
        range: boolean
      creator:
        description: The creator/submitter of datasets
      providerName:
        description: (Project/Publisher) Text search over the dataset project/provider
          metadata. Supports phrase search with double quotes and single-term wildcards.
          Unquoted or non-exact values may be tokenized and can match multiple providers
          that share one or more terms.
      text:
        description: Searches any metadata field that contains the passed text
      datePublished:
        description: "This is the date range of a the publication of a package. It\
          \ should follow a one of the following formats:\n \n- YYYY  \n - YYYY-MM\
          \ \n- [YYYY-MM-DD TO YYYY-MM-DD] \n- [YYYY TO YYYY-MM-DD] \n- [YYYY-MM-DD\
          \ TO *] \n\n \nExample 1: if you want the packages from Jan-1-2021 to Nov-01-2021\
          \ [2021-01-01 TO 2021-11-01] \n \nExample 2: if you want the packages from\
          \ Jan-1-2021 to present [2021-01-01 TO *]"
      beginDate:
        description: Temporal coverage window start date in YYYY, YYYY-MM, or YYYY-MM-DD.
      endDate:
        description: Temporal coverage window end date in YYYY, YYYY-MM, or YYYY-MM-DD.
      keywords:
        multivalued: true
      bbox:
        description: 'Bounding box in the format min_lat,min_lon,max_lat,max_lon.
          Example: 34.0000,-119.0000,35.0000,-117.0000'
      lat:
        description: Latitude for point-based spatial search. Must be used with longitude
          (lon) and radius.
        range: float
      lon:
        description: Longitude for point-based spatial search. Must be used with latitude
          (lat) and radius.
        range: float
      radius:
        description: Point-based search radius in meters. Must be used with latitude
          (lat) and longitude (lon). This is an approximate nearby search using geohash
          cells (optimized for recall, with possible false positives near cell edges).
        range: float
      sort:
        description: 'Comma-separated ordered sort clauses in the format `field:direction`.
          Supported fields: `name`, `dateUploaded`, `authorLastName`. Supported directions:
          `asc`, `desc`.'
